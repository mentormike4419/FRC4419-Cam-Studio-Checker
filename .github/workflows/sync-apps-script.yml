name: Sync Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps-script/Code.gs
      - apps-script/CamReport.gs

permissions:
  contents: read

concurrency:
  group: apps-script-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync Code.gs and CamReport.gs to existing project
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLASPRC_JSON" || -z "$APPS_SCRIPT_ID" ]]; then
            echo "Set CLASPRC_JSON and APPS_SCRIPT_ID as repository Actions secrets." >&2
            exit 1
          fi
          npm install --global @google/clasp
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          PROJECT_DIR="$RUNNER_TEMP/cam-checker-script"
          mkdir -p "$PROJECT_DIR"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({scriptId: process.env.APPS_SCRIPT_ID}))' "$PROJECT_DIR/.clasp.json"
          cd "$PROJECT_DIR"
          clasp pull
          cp "$GITHUB_WORKSPACE/apps-script/Code.gs" Code.js
          cp "$GITHUB_WORKSPACE/apps-script/CamReport.gs" CamReport.js
          clasp push --force
          echo "Synced Code.gs and CamReport.gs."
          DEPLOYMENT_ID="$(node -e 'const fs = require("fs"); const src = fs.readFileSync(process.argv[1], "utf8"); const match = src.match(/https:\/\/script\.google\.com\/macros\/s\/([^/"]+)\/exec/); if (!match) process.exit(1); process.stdout.write(match[1]);' "$GITHUB_WORKSPACE/apps-script/extension-integrated/background.js")"
          if ! clasp list-deployments | grep -Fq -- "$DEPLOYMENT_ID"; then
            echo "The deployment configured in background.js was not found in this Apps Script project." >&2
            exit 1
          fi
          DEPLOY_OUTPUT="$(clasp update-deployment "$DEPLOYMENT_ID" --description "FRC4419 CAM Checker $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)")"
          printf '%s\n' "$DEPLOY_OUTPUT"
          DEPLOYED_VERSION="$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -nE 's/.*@([0-9]+).*/\1/p' | tail -n 1)"
          REPORT_VERSION="$(node -e 'const fs=require("fs");const text=fs.readFileSync(process.argv[1],"utf8");const match=text.match(/CAM_REPORT_VERSION\s*=\s*"([^"]+)"/);if(!match)process.exit(1);process.stdout.write(match[1]);' "$GITHUB_WORKSPACE/apps-script/CamReport.gs")"
          if [[ -z "$DEPLOYED_VERSION" || "$REPORT_VERSION" != "1.$DEPLOYED_VERSION" ]]; then
            echo "Report version $REPORT_VERSION does not match deployed Apps Script version 1.$DEPLOYED_VERSION." >&2
            exit 1
          fi
          echo "Updated the existing web app deployment as $REPORT_VERSION."
